<script>
// ===== Constants =====
const DB_NAME = 'zedinfer_webui';
const DB_VERSION = 1;
const LEGACY_STORAGE = 'zedinfer_state';
const UI_STORAGE = 'zedinfer_ui_state';
const SPIN_MS = 900;
const THINK_OPEN = '<think>';
const THINK_CLOSE = '</think>';
const WELCOME_HTML = `<div class="welcome" id="welcome">
    <div class="welcome-logo"><img src="/images/logo-light.svg" alt="ZedInfer"></div>
    <h2>ZedInfer Chat</h2>
    <p>A lightweight C++ inference engine. Type a message below to start chatting.</p>
</div>`;

// ===== DOM =====
const chatEl = document.getElementById('chat');
const chatScroll = document.getElementById('chat-scroll');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const modelNameEl = document.getElementById('model-name');
const maxTokensEl = document.getElementById('max-tokens');
const historyListEl = document.getElementById('history-list');
const toastStackEl = document.getElementById('toast-stack');
const confirmModalEl = document.getElementById('confirm-modal');
const confirmModalBackdropEl = document.getElementById('confirm-modal-backdrop');
const confirmModalTitleEl = document.getElementById('confirm-modal-title');
const confirmModalMessageEl = document.getElementById('confirm-modal-message');
const confirmModalCancelEl = document.getElementById('confirm-modal-cancel');
const confirmModalConfirmEl = document.getElementById('confirm-modal-confirm');

// ===== App State =====
let dbPromise = null;
let conversations = [];
let allConversationMessages = [];
let messages = [];
let currentConversation = null;
let generating = false;
let abortCtrl = null;
let editorState = null;
let confirmModalState = null;
const thoughtOpenState = new Map();

function genId() {
    return Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
}

function escapeHtml(text) {
    return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function getCurrentConvId() {
    return currentConversation?.id || null;
}

function loadLegacyStore() {
    try {
        return JSON.parse(localStorage.getItem(LEGACY_STORAGE)) || {};
    } catch {
        return {};
    }
}

function loadUiState() {
    try {
        return JSON.parse(localStorage.getItem(UI_STORAGE)) || {};
    } catch {
        return {};
    }
}

function saveUiState(patch) {
    const next = { ...loadUiState(), ...patch };
    localStorage.setItem(UI_STORAGE, JSON.stringify(next));
    return next;
}

function getMaxTokens() {
    const value = parseInt(maxTokensEl.value, 10);
    return Number.isFinite(value) && value > 0 ? value : 1024;
}

function deleteServerSession(sessionId) {
    if (!sessionId) return;
    fetch('/v1/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' }).catch(() => {});
}

function dismissToast(toast) {
    if (!toast || toast.dataset.closing === '1') return;
    toast.dataset.closing = '1';
    clearTimeout(toast._dismissTimer);
    toast.classList.remove('is-visible');
    setTimeout(() => {
        toast.remove();
    }, 180);
}

function showToast(message, type = 'info', options = {}) {
    if (!toastStackEl) return;

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.setAttribute('role', type === 'error' ? 'alert' : 'status');

    const title = document.createElement('span');
    title.className = 'toast-title';
    title.textContent = options.title || (
        type === 'success' ? 'Copied' :
        type === 'error' ? 'Error' :
        'Notice'
    );

    const body = document.createElement('div');
    body.className = 'toast-message';
    body.textContent = String(message || '');

    toast.appendChild(title);
    toast.appendChild(body);
    toast.addEventListener('click', () => dismissToast(toast));
    toastStackEl.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.add('is-visible');
    });

    const duration = options.duration ?? (type === 'error' ? 4200 : 2200);
    toast._dismissTimer = setTimeout(() => {
        dismissToast(toast);
    }, duration);

    return toast;
}

function showError(message, error) {
    console.error(message, error);
    const detail = error?.message || String(error || message);
    showToast(`${message}: ${detail}`, 'error', {
        title: 'Error',
        duration: 4200,
    });
}

function closeConfirmModal(result) {
    if (!confirmModalState) return;
    const state = confirmModalState;
    confirmModalState = null;
    confirmModalEl.hidden = true;
    confirmModalConfirmEl.classList.remove('danger');
    confirmModalConfirmEl.textContent = 'Confirm';
    confirmModalCancelEl.textContent = 'Cancel';
    state.resolve(result);
    if (state.previousFocus && typeof state.previousFocus.focus === 'function') {
        state.previousFocus.focus();
    }
}

function openConfirmModal(options = {}) {
    if (!confirmModalEl) {
        return Promise.resolve(false);
    }

    if (confirmModalState) {
        closeConfirmModal(false);
    }

    return new Promise(resolve => {
        confirmModalState = {
            resolve,
            previousFocus: document.activeElement,
        };

        confirmModalTitleEl.textContent = options.title || 'Confirm';
        confirmModalMessageEl.textContent = options.message || '';
        confirmModalCancelEl.textContent = options.cancelText || 'Cancel';
        confirmModalConfirmEl.textContent = options.confirmText || 'Confirm';
        confirmModalConfirmEl.classList.toggle('danger', Boolean(options.danger));
        confirmModalEl.hidden = false;

        requestAnimationFrame(() => {
            confirmModalConfirmEl.focus();
        });
    });
}

function requestToPromise(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
    });
}

function transactionToPromise(transaction) {
    return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed'));
        transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));
    });
}

function openDatabase() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available in this browser.'));
            return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains('conversations')) {
                const conversationsStore = db.createObjectStore('conversations', { keyPath: 'id' });
                conversationsStore.createIndex('lastModified', 'lastModified', { unique: false });
            }

            if (!db.objectStoreNames.contains('messages')) {
                const messagesStore = db.createObjectStore('messages', { keyPath: 'id' });
                messagesStore.createIndex('convId', 'convId', { unique: false });
                messagesStore.createIndex('parent', 'parent', { unique: false });
                messagesStore.createIndex('timestamp', 'timestamp', { unique: false });
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Failed to open IndexedDB'));
    });
    return dbPromise;
}

async function dbGetConversation(convId) {
    const db = await openDatabase();
    return requestToPromise(db.transaction('conversations', 'readonly').objectStore('conversations').get(convId));
}

async function dbPutConversation(record) {
    const db = await openDatabase();
    const tx = db.transaction('conversations', 'readwrite');
    tx.objectStore('conversations').put(record);
    await transactionToPromise(tx);
    return record;
}

async function dbDeleteConversation(convId) {
    const db = await openDatabase();
    const tx = db.transaction('conversations', 'readwrite');
    tx.objectStore('conversations').delete(convId);
    await transactionToPromise(tx);
}

async function dbGetAllConversations() {
    const db = await openDatabase();
    const list = await requestToPromise(
        db.transaction('conversations', 'readonly').objectStore('conversations').getAll()
    );
    return list.sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
}

async function dbGetMessage(messageId) {
    const db = await openDatabase();
    return requestToPromise(db.transaction('messages', 'readonly').objectStore('messages').get(messageId));
}

async function dbPutMessage(record) {
    const db = await openDatabase();
    const tx = db.transaction('messages', 'readwrite');
    tx.objectStore('messages').put(record);
    await transactionToPromise(tx);
    return record;
}

async function dbDeleteMessage(messageId) {
    const db = await openDatabase();
    const tx = db.transaction('messages', 'readwrite');
    tx.objectStore('messages').delete(messageId);
    await transactionToPromise(tx);
}

async function dbGetConversationMessages(convId) {
    const db = await openDatabase();
    const messagesStore = db.transaction('messages', 'readonly').objectStore('messages').index('convId');
    const list = await requestToPromise(messagesStore.getAll(convId));
    return list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
}

async function updateConversationRecord(convId, updates) {
    const current = await dbGetConversation(convId);
    if (!current) return null;
    const next = {
        ...current,
        ...updates,
        lastModified: updates.lastModified ?? Date.now(),
    };
    await dbPutConversation(next);
    return next;
}

async function updateMessageRecord(messageId, updates) {
    const current = await dbGetMessage(messageId);
    if (!current) return null;
    const next = { ...current, ...updates };
    await dbPutMessage(next);
    return next;
}

async function createConversation(name = 'Untitled', options = {}) {
    const conversation = {
        id: options.id || genId(),
        name,
        titleSource: options.titleSource || 'auto',
        lastModified: options.lastModified || Date.now(),
        currNode: options.currNode || null,
        sessionId: options.sessionId || null,
    };
    await dbPutConversation(conversation);
    return conversation;
}

async function ensureRootMessage(convId) {
    const existingMessages = await dbGetConversationMessages(convId);
    const root = existingMessages.find(message => message.type === 'root' && message.parent === null);
    if (root) return root;

    const rootMessage = {
        id: genId(),
        convId,
        type: 'root',
        role: 'system',
        content: '',
        timestamp: Date.now(),
        parent: null,
        children: [],
    };
    await dbPutMessage(rootMessage);
    return rootMessage;
}

async function appendChildToParent(parentId, childId) {
    if (!parentId) return;
    const parent = await dbGetMessage(parentId);
    if (!parent) throw new Error(`Parent message ${parentId} not found`);
    const nextChildren = Array.isArray(parent.children) ? [...parent.children] : [];
    if (!nextChildren.includes(childId)) {
        nextChildren.push(childId);
        await dbPutMessage({ ...parent, children: nextChildren });
    }
}

async function removeChildFromParent(parentId, childId) {
    if (!parentId) return;
    const parent = await dbGetMessage(parentId);
    if (!parent) return;
    const nextChildren = (parent.children || []).filter(id => id !== childId);
    if (nextChildren.length !== (parent.children || []).length) {
        await dbPutMessage({ ...parent, children: nextChildren });
    }
}

async function createMessageBranch(message, parentId) {
    const nextMessage = {
        id: genId(),
        convId: message.convId,
        type: message.type || 'text',
        role: message.role,
        content: message.content || '',
        timestamp: message.timestamp || Date.now(),
        parent: parentId || null,
        children: [],
    };

    await dbPutMessage(nextMessage);
    await appendChildToParent(parentId, nextMessage.id);
    const updatedConversation = await updateConversationRecord(message.convId, {
        currNode: nextMessage.id,
    });
    if (currentConversation?.id === message.convId && updatedConversation) {
        currentConversation = updatedConversation;
    }
    return nextMessage;
}

async function deleteLeafMessage(convId, messageId) {
    const message = await dbGetMessage(messageId);
    if (!message) return;
    if (message.children?.length) {
        throw new Error('Only leaf messages can be deleted.');
    }

    await removeChildFromParent(message.parent, message.id);
    await dbDeleteMessage(message.id);

    const conversation = await dbGetConversation(convId);
    if (conversation?.currNode === message.id) {
        const updatedConversation = await updateConversationRecord(convId, {
            currNode: message.parent || null,
        });
        if (currentConversation?.id === convId && updatedConversation) {
            currentConversation = updatedConversation;
        }
    }
}

async function deleteConversationCascade(convId) {
    const conversation = await dbGetConversation(convId);
    const storedMessages = await dbGetConversationMessages(convId);
    for (const message of storedMessages) {
        await dbDeleteMessage(message.id);
    }
    await dbDeleteConversation(convId);
    return conversation;
}

function deriveTitleFromMessageList(list) {
    const firstUser = list.find(message => message.role === 'user' && String(message.content || '').trim());
    return (firstUser?.content || 'Untitled').trim().slice(0, 60) || 'Untitled';
}

function filterByLeafNodeId(sourceMessages, leafNodeId, includeRoot = false) {
    if (!Array.isArray(sourceMessages) || sourceMessages.length === 0) return [];

    const nodeMap = new Map();
    for (const message of sourceMessages) nodeMap.set(message.id, message);

    let current = leafNodeId ? nodeMap.get(leafNodeId) : null;
    if (!current) {
        current = sourceMessages.reduce((latest, message) => {
            if (!latest || (message.timestamp || 0) > (latest.timestamp || 0)) return message;
            return latest;
        }, null);
    }

    const path = [];
    while (current) {
        if (includeRoot || current.type !== 'root') {
            path.push(current);
        }
        if (!current.parent) break;
        current = nodeMap.get(current.parent) || null;
    }

    return path.reverse();
}

function findLeafNode(sourceMessages, messageId) {
    const nodeMap = new Map();
    for (const message of sourceMessages) nodeMap.set(message.id, message);

    let current = nodeMap.get(messageId);
    while (current && current.children?.length) {
        const lastChildId = current.children[current.children.length - 1];
        current = nodeMap.get(lastChildId);
    }
    return current?.id || messageId;
}

function findDescendantMessages(sourceMessages, messageId) {
    const nodeMap = new Map();
    for (const message of sourceMessages) nodeMap.set(message.id, message);

    const descendants = [];
    const queue = [messageId];
    while (queue.length) {
        const currentId = queue.shift();
        const current = nodeMap.get(currentId);
        if (!current) continue;

        for (const childId of current.children || []) {
            descendants.push(childId);
            queue.push(childId);
        }
    }

    return descendants;
}

function getMessageSiblings(sourceMessages, messageId) {
    const nodeMap = new Map();
    for (const message of sourceMessages) nodeMap.set(message.id, message);

    const message = nodeMap.get(messageId);
    if (!message) return null;
    if (!message.parent) {
        return {
            siblingLeafIds: [message.id],
            currentIndex: 0,
            totalSiblings: 1,
        };
    }

    const parent = nodeMap.get(message.parent);
    if (!parent) {
        return {
            siblingLeafIds: [message.id],
            currentIndex: 0,
            totalSiblings: 1,
        };
    }

    const siblingIds = parent.children || [];
    return {
        siblingLeafIds: siblingIds.map(id => findLeafNode(sourceMessages, id)),
        currentIndex: siblingIds.indexOf(message.id),
        totalSiblings: siblingIds.length,
    };
}

function buildApiMessages(pathMessages) {
    return pathMessages
        .filter(message => message.type !== 'root')
        .map(message => ({ role: message.role, content: message.content || '' }));
}

async function refreshConversations() {
    conversations = await dbGetAllConversations();
    renderHistory();
    return conversations;
}

function rememberThoughtStates() {
    for (const row of chatEl.querySelectorAll('.msg-row[data-message-id]')) {
        const details = row.querySelector('.thought-toggle');
        if (!details) continue;
        if (details.open) {
            thoughtOpenState.set(row.dataset.messageId, true);
        } else {
            thoughtOpenState.delete(row.dataset.messageId);
        }
    }
}

function setGenerating(value) {
    generating = value;
    sendBtn.style.display = value ? 'none' : 'flex';
    stopBtn.style.display = value ? 'flex' : 'none';
    sendBtn.disabled = value;
}

function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
}

function roleLabel(role) {
    if (role === 'assistant') return 'Assistant';
    if (role === 'user') return 'User';
    return 'System';
}

function getMessageById(messageId) {
    return allConversationMessages.find(message => message.id === messageId) || null;
}

function getMessageBodyElement(messageId) {
    return chatEl.querySelector(`.msg-row[data-message-id="${messageId}"] .msg-body`);
}

function createToolButton(label, onClick, options = {}) {
    const button = document.createElement('button');
    button.className = 'tool-btn';
    button.textContent = label;
    button.disabled = Boolean(options.disabled);
    button.addEventListener('click', event => {
        event.stopPropagation();
        onClick();
    });
    return button;
}

function getActionIcon(name) {
    const icons = {
        edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        regenerate: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2v6h-6"/><path d="M3 22v-6h6"/><path d="M20.49 9A9 9 0 0 0 5 5.5L3 8"/><path d="M3.51 15A9 9 0 0 0 19 18.5L21 16"/></svg>',
        copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        delete: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
        prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
        next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
    };
    return icons[name] || '';
}

function createActionButton(icon, title, onClick, options = {}) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action-btn' + (options.className ? ` ${options.className}` : '');
    button.title = title;
    button.setAttribute('aria-label', title);
    button.innerHTML = getActionIcon(icon);
    button.disabled = Boolean(options.disabled);
    button.addEventListener('click', event => {
        event.stopPropagation();
        onClick(button);
    });
    return button;
}

function flashActionButton(button) {
    if (!button) return;
    button.classList.add('is-active');
    clearTimeout(button._flashTimer);
    button._flashTimer = setTimeout(() => {
        button.classList.remove('is-active');
    }, 1200);
}

async function writeClipboardText(text) {
    const value = String(text ?? '');
    const clipboard = globalThis.navigator?.clipboard;
    if (clipboard && typeof clipboard.writeText === 'function') {
        await clipboard.writeText(value);
        return;
    }

    const textarea = document.createElement('textarea');
    textarea.value = value;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    textarea.style.opacity = '0';

    const activeElement = document.activeElement;
    const selection = document.getSelection ? document.getSelection() : null;
    const savedRanges = [];
    if (selection) {
        for (let index = 0; index < selection.rangeCount; index++) {
            savedRanges.push(selection.getRangeAt(index).cloneRange());
        }
    }

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    let copied = false;
    try {
        copied = typeof document.execCommand === 'function' && document.execCommand('copy');
    } finally {
        document.body.removeChild(textarea);
        if (selection) {
            selection.removeAllRanges();
            for (const range of savedRanges) {
                selection.addRange(range);
            }
        }
        if (activeElement && typeof activeElement.focus === 'function') {
            activeElement.focus();
        }
    }

    if (!copied) {
        throw new Error('Clipboard API is unavailable in this browser context');
    }
}

function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.max(140, Math.min(textarea.scrollHeight, 420)) + 'px';
}

function renderBranchNavigator(message) {
    const siblingInfo = getMessageSiblings(allConversationMessages, message.id);
    if (!siblingInfo || siblingInfo.totalSiblings <= 1) return null;

    const nav = document.createElement('div');
    nav.className = 'branch-nav';

    const prevButton = createActionButton('prev', 'Previous branch', () => {
        const target = siblingInfo.siblingLeafIds[siblingInfo.currentIndex - 1];
        if (target) navigateToSibling(target);
    }, { disabled: generating || siblingInfo.currentIndex <= 0 });

    const status = document.createElement('span');
    status.className = 'branch-status';
    status.textContent = `${siblingInfo.currentIndex + 1}/${siblingInfo.totalSiblings}`;

    const nextButton = createActionButton('next', 'Next branch', () => {
        const target = siblingInfo.siblingLeafIds[siblingInfo.currentIndex + 1];
        if (target) navigateToSibling(target);
    }, { disabled: generating || siblingInfo.currentIndex >= siblingInfo.totalSiblings - 1 });

    nav.appendChild(prevButton);
    nav.appendChild(status);
    nav.appendChild(nextButton);
    return nav;
}

function getFullMessageText(message) {
    if (!message) return '';
    if (message.role !== 'assistant') return String(message.content || '');

    const parsed = splitAssistantContent(message.content || '');
    if (!parsed.hasThought) return parsed.answer || '';
    return [parsed.thought, parsed.answer].filter(Boolean).join('\n\n');
}

async function copyMessageContent(messageId, button) {
    const message = getMessageById(messageId);
    if (!message) return;
    try {
        await writeClipboardText(getFullMessageText(message));
        flashActionButton(button);
        showToast('Message copied to clipboard.', 'success', {
            title: 'Copied',
            duration: 2200,
        });
    } catch (error) {
        showError('Failed to copy message', error);
    }
}

async function deleteMessageBranch(messageId) {
    if (generating || !currentConversation) return;
    const message = getMessageById(messageId);
    if (!message || message.type === 'root') return;

    const descendantIds = findDescendantMessages(allConversationMessages, message.id);
    if (descendantIds.length > 0) {
        const descendantCount = descendantIds.length;
        const descendantLabel = descendantCount === 1 ? 'message' : 'messages';
        const confirmed = await openConfirmModal({
            title: 'Delete branch?',
            message: `Deleting this historical message will also remove ${descendantCount} child ${descendantLabel} in the same branch.`,
            confirmText: 'Delete',
            cancelText: 'Cancel',
            danger: true,
        });
        if (!confirmed) return;
    }

    try {
        await invalidateConversationSession(currentConversation.id);

        const deletedIds = new Set([message.id, ...descendantIds]);
        const remainingMessages = allConversationMessages.filter(item => !deletedIds.has(item.id));
        const parent = message.parent ? allConversationMessages.find(item => item.id === message.parent) : null;
        const remainingSiblingIds = parent
            ? (parent.children || []).filter(id => id !== message.id && !deletedIds.has(id))
            : [];

        let nextCurrNode = currentConversation.currNode;
        if (!nextCurrNode || deletedIds.has(nextCurrNode)) {
            if (remainingSiblingIds.length) {
                nextCurrNode = findLeafNode(remainingMessages, remainingSiblingIds[remainingSiblingIds.length - 1]);
            } else if (parent && parent.type !== 'root') {
                nextCurrNode = parent.id;
            } else {
                nextCurrNode = null;
            }
        }

        await removeChildFromParent(message.parent, message.id);
        for (const deletedId of deletedIds) {
            thoughtOpenState.delete(deletedId);
            await dbDeleteMessage(deletedId);
        }

        let updatedConversation = await updateConversationRecord(currentConversation.id, {
            currNode: nextCurrNode,
            sessionId: null,
        });
        if (updatedConversation?.titleSource === 'auto' && !nextCurrNode) {
            updatedConversation = await updateConversationRecord(currentConversation.id, {
                name: 'Untitled',
            });
        }
        currentConversation = updatedConversation;

        if (nextCurrNode) {
            await loadConversation(currentConversation.id);
            await syncConversationNameFromCurrentPath(currentConversation.id);
        }
        await loadConversation(currentConversation.id);
    } catch (error) {
        showError('Failed to delete branch', error);
        await loadConversation(currentConversation.id);
    }
}

function renderEditor(message) {
    const shell = document.createElement('div');
    shell.className = 'editor-shell';

    const textarea = document.createElement('textarea');
    textarea.value = editorState?.messageId === message.id ? editorState.content : message.content;
    textarea.placeholder = message.role === 'assistant'
        ? 'Edit assistant message...'
        : 'Edit user message...';
    textarea.addEventListener('input', () => {
        if (!editorState || editorState.messageId !== message.id) return;
        editorState.content = textarea.value;
        saveButton.disabled = !textarea.value.trim();
        autoResizeTextarea(textarea);
    });
    textarea.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            event.preventDefault();
            saveEdit(message.id);
        }
        if (event.key === 'Escape') {
            event.preventDefault();
            cancelEdit();
        }
    });
    shell.appendChild(textarea);

    const foot = document.createElement('div');
    foot.className = 'editor-foot';

    const left = document.createElement('div');
    left.className = 'editor-note';

    if (message.role === 'assistant') {
        const toggle = document.createElement('label');
        toggle.className = 'editor-toggle';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(editorState?.branchAssistant);
        checkbox.addEventListener('change', () => {
            if (editorState?.messageId === message.id) {
                editorState.branchAssistant = checkbox.checked;
            }
        });

        const text = document.createElement('span');
        text.textContent = 'Create a new branch';

        toggle.appendChild(checkbox);
        toggle.appendChild(text);
        left.appendChild(toggle);
    } else {
        left.textContent = 'Saving creates a new branch and regenerates the reply.';
    }

    const actions = document.createElement('div');
    actions.className = 'editor-actions';

    const cancelButton = createToolButton('Cancel', cancelEdit);
    const saveButton = createToolButton('Save', () => saveEdit(message.id));
    saveButton.disabled = !textarea.value.trim();

    actions.appendChild(cancelButton);
    actions.appendChild(saveButton);
    foot.appendChild(left);
    foot.appendChild(actions);
    shell.appendChild(foot);

    setTimeout(() => {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        autoResizeTextarea(textarea);
    }, 0);

    return shell;
}

function renderMessageRow(message) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.dataset.messageId = message.id;

    const inner = document.createElement('div');
    inner.className = 'msg-inner';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + message.role;
    const avatarImage = document.createElement('img');
    avatarImage.src = message.role === 'user' ? '/images/user.svg' : '/images/bot.svg';
    avatarImage.alt = message.role;
    avatar.appendChild(avatarImage);

    const content = document.createElement('div');
    content.className = 'msg-content';

    const body = document.createElement('div');
    body.className = 'msg-body';

    if (editorState?.messageId === message.id) {
        body.appendChild(renderEditor(message));
    } else if (message.role === 'assistant') {
        body.innerHTML = renderAssistantContent(message.content || '', {
            keepThoughtOpen: thoughtOpenState.get(message.id),
        });
        highlightCodeBlocks(body);
    } else {
        body.innerHTML = renderMarkdown(message.content || '');
        highlightCodeBlocks(body);
    }

    content.appendChild(body);

    if (!editorState?.messageId || editorState.messageId !== message.id) {
        const footer = document.createElement('div');
        footer.className = 'msg-footer';

        const footerRole = document.createElement('div');
        footerRole.className = 'msg-role';
        footerRole.textContent = roleLabel(message.role);

        const actions = document.createElement('div');
        actions.className = 'msg-actions';

        const branchNavigator = renderBranchNavigator(message);
        if (branchNavigator) {
            actions.appendChild(branchNavigator);
        }

        actions.appendChild(createActionButton('edit', 'Edit message', () => startEdit(message.id), {
            disabled: generating,
        }));

        if (message.role === 'assistant') {
            actions.appendChild(createActionButton('regenerate', 'Regenerate', () => regenerateAssistant(message.id), {
                disabled: generating,
            }));
        }

        actions.appendChild(createActionButton('copy', 'Copy full text', button => copyMessageContent(message.id, button)));
        actions.appendChild(createActionButton('delete', 'Delete this branch', () => deleteMessageBranch(message.id), {
            disabled: generating,
            className: 'danger',
        }));

        footer.appendChild(footerRole);
        footer.appendChild(actions);
        content.appendChild(footer);
    }

    inner.appendChild(avatar);
    inner.appendChild(content);
    row.appendChild(inner);
    return row;
}

function renderConversation() {
    rememberThoughtStates();
    chatEl.innerHTML = '';

    if (!messages.length) {
        chatEl.innerHTML = WELCOME_HTML;
        return;
    }

    for (const message of messages) {
        chatEl.appendChild(renderMessageRow(message));
    }

    scrollToBottom();
}

function renderHistory() {
    historyListEl.innerHTML = '';
    const visibleConversations = conversations.filter(conversation => conversation.currNode);

    if (!visibleConversations.length) {
        const empty = document.createElement('li');
        empty.className = 'history-empty';
        empty.textContent = 'No saved conversations yet.';
        historyListEl.appendChild(empty);
        return;
    }

    for (const conversation of visibleConversations) {
        const item = document.createElement('li');
        item.className = 'history-item' + (conversation.id === getCurrentConvId() ? ' active' : '');
        item.title = conversation.name;

        const label = document.createElement('span');
        label.textContent = conversation.name;
        label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0';
        label.ondblclick = event => {
            event.stopPropagation();
            const renameInput = document.createElement('input');
            renameInput.className = 'rename-input';
            renameInput.value = conversation.name;
            renameInput.onclick = e => e.stopPropagation();
            renameInput.onkeydown = event => {
                if (event.key === 'Enter') {
                    renameConversation(conversation.id, renameInput.value.trim() || conversation.name);
                }
                if (event.key === 'Escape') {
                    renderHistory();
                }
            };
            renameInput.onblur = () => renameConversation(conversation.id, renameInput.value.trim() || conversation.name);
            label.replaceWith(renameInput);
            renameInput.focus();
            renameInput.select();
        };

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-btn';
        deleteButton.textContent = '\u00d7';
        deleteButton.onclick = event => {
            event.stopPropagation();
            deleteConversation(conversation.id);
        };

        item.appendChild(label);
        item.appendChild(deleteButton);
        item.onclick = () => switchTo(conversation.id);
        historyListEl.appendChild(item);
    }
}

function normalizeCodeLanguage(lang) {
    const raw = String(lang || '').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9#+._-]/g, '');
    if (!raw) return '';
    if (raw === 'c++') return 'cpp';
    if (raw === 'c#') return 'csharp';
    if (raw === 'shell') return 'bash';
    return raw;
}

function formatCodeLanguageLabel(lang) {
    const value = String(lang || '').trim().toLowerCase();
    if (!value) return 'Text';

    const aliases = {
        plaintext: 'Text',
        text: 'Text',
        js: 'JavaScript',
        cpp: 'C++',
        cxx: 'C++',
        csharp: 'C#',
        javascript: 'JavaScript',
        ts: 'TypeScript',
        typescript: 'TypeScript',
        py: 'Python',
        rb: 'Ruby',
        rs: 'Rust',
        sh: 'Bash',
        bash: 'Bash',
        shell: 'Shell',
        objectivec: 'Objective-C',
        json: 'JSON',
        xml: 'XML',
        yml: 'YAML',
        yaml: 'YAML',
        html: 'HTML',
        css: 'CSS',
        sql: 'SQL',
        md: 'Markdown',
        markdown: 'Markdown',
        makefile: 'Makefile',
    };
    if (aliases[value]) return aliases[value];

    return value
        .split(/[-_]/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
}

function renderCodeBlock(lang, code, options = {}) {
    const id = 'cb' + Math.random().toString(36).slice(2, 8);
    const language = normalizeCodeLanguage(lang);
    const languageClass = language
        ? ` language-${language}`
        : (options.open ? ' language-plaintext' : '');
    const openAttr = options.open ? ' data-open-fence="1"' : '';
    const label = formatCodeLanguageLabel(language || (options.open ? 'plaintext' : ''));
    const dataLanguage = language ? ` data-code-language="${language}"` : '';
    return `<pre><div class="code-head"><span class="code-lang" data-code-lang>${label}</span><button class="copy-btn" onclick="copyCode('${id}')">Copy</button></div><code id="${id}" class="${languageClass.trim()}"${dataLanguage}${openAttr}>${code.trimEnd()}</code></pre>`;
}

function renderMarkdown(text) {
    let html = escapeHtml(text);
    const codeBlocks = [];
    const stashCodeBlock = (lang, code, options = {}) => {
        const token = `\u0000CODE${codeBlocks.length}\u0000`;
        codeBlocks.push(renderCodeBlock((lang || '').trim(), code || '', options));
        return token;
    };

    html = html.replace(/(^|\n)```([^\n`]*)\n([\s\S]*?)```/g, (_, lead, lang, code) => `${lead}${stashCodeBlock(lang, code)}`);
    html = html.replace(/(^|\n)```([^\n`]*)?(?:\n([\s\S]*))?$/, (_, lead, lang, code) => `${lead}${stashCodeBlock(lang, code, { open: true })}`);

    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    html = html.replace(/((?:^|\n)\|.+\|(?:\n\|[-: |]+\|)(?:\n\|.+\|)+)/g, (_, table) => {
        const rows = table.trim().split('\n').filter(row => row.trim());
        if (rows.length < 2) return table;
        const header = rows[0].split('|').filter(cell => cell.trim()).map(cell => `<th>${cell.trim()}</th>`).join('');
        let body = '';
        for (let i = 2; i < rows.length; i++) {
            const cells = rows[i].split('|').filter(cell => cell.trim()).map(cell => `<td>${cell.trim()}</td>`).join('');
            body += `<tr>${cells}</tr>`;
        }
        return `<table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>`;
    });

    html = html.replace(/(^|\n)### (.+)/g, '$1<h3>$2</h3>');
    html = html.replace(/(^|\n)## (.+)/g, '$1<h2>$2</h2>');
    html = html.replace(/(^|\n)# (.+)/g, '$1<h1>$2</h1>');

    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    html = html.replace(/(^|\n)([-*] .+(\n[-*] .+)*)/g, (_, prefix, list) => {
        return prefix + '<ul>' + list.split('\n').map(line => '<li>' + line.replace(/^[-*] /, '') + '</li>').join('') + '</ul>';
    });
    html = html.replace(/(^|\n)(\d+\. .+(\n\d+\. .+)*)/g, (_, prefix, list) => {
        return prefix + '<ol>' + list.split('\n').map(line => '<li>' + line.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>';
    });

    html = html.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    return html.replace(/\u0000CODE(\d+)\u0000/g, (_, index) => codeBlocks[Number(index)]);
}

async function copyCode(id) {
    const element = document.getElementById(id);
    if (!element) return;
    try {
        await writeClipboardText(element.textContent);
        const button = element.parentElement.querySelector('.copy-btn');
        if (button) {
            button.textContent = 'Copied!';
            setTimeout(() => {
                button.textContent = 'Copy';
            }, 1500);
        }
        showToast('Code copied to clipboard.', 'success', {
            title: 'Copied',
            duration: 2200,
        });
    } catch (error) {
        showError('Failed to copy code', error);
    }
}

function highlightCodeBlocks(container) {
    if (!container || !window.hljs) return;
    for (const block of container.querySelectorAll('pre code')) {
        if (block.dataset.hljsApplied === '1') continue;
        window.hljs.highlightElement(block);
        const label = block.parentElement?.querySelector('[data-code-lang]');
        if (label) {
            const explicit = block.dataset.codeLanguage || '';
            const detected = explicit || block.result?.language || '';
            label.textContent = formatCodeLanguageLabel(detected || 'plaintext');
        }
        block.dataset.hljsApplied = '1';
    }
}

function splitAssistantContent(text) {
    const raw = String(text || '');
    const openIndex = raw.indexOf(THINK_OPEN);
    if (openIndex === -1) {
        return { hasThought: false, thought: '', answer: raw.trim(), thinking: false };
    }

    const before = raw.slice(0, openIndex).trim();
    const afterOpen = raw.slice(openIndex + THINK_OPEN.length);
    const closeIndex = afterOpen.indexOf(THINK_CLOSE);

    if (closeIndex === -1) {
        return {
            hasThought: true,
            thought: afterOpen.trim(),
            answer: before,
            thinking: true,
        };
    }

    const thought = afterOpen.slice(0, closeIndex).trim();
    const afterClose = afterOpen.slice(closeIndex + THINK_CLOSE.length).trim();
    const answer = [before, afterClose].filter(Boolean).join('\n\n');

    return {
        hasThought: true,
        thought,
        answer,
        thinking: false,
    };
}

function renderThinkingText(label) {
    const phase = Math.floor(performance.now() % SPIN_MS);
    return `<span class="thinking-text"><span class="thinking-spinner" style="animation-delay:-${phase}ms"></span>${label}</span>`;
}

function renderAssistantContent(content, options = {}) {
    const parsed = splitAssistantContent(content);
    const shouldOpen = options.keepThoughtOpen || (parsed.thinking && !options.streaming);
    const openAttr = shouldOpen ? ' open' : '';

    if (!content && options.streaming) {
        return `<div class="assistant-placeholder">${renderThinkingText('Thinking')}</div>`;
    }

    let html = '';
    if (parsed.hasThought) {
        const thoughtHtml = parsed.thought
            ? renderMarkdown(parsed.thought)
            : '<p class="thought-empty">No reasoning content.</p>';
        html += `<details class="thought-toggle${parsed.thinking ? ' thinking' : ''}"${openAttr}>
            <summary>
                ${parsed.thinking ? renderThinkingText('Thinking') : '<span class="thought-chevron"></span>'}
                ${parsed.thinking ? '<span class="thought-chevron"></span>' : ''}
                <span class="thought-label-collapsed">${parsed.thinking ? '' : 'Expand reasoning'}</span>
                <span class="thought-label-expanded">Collapse reasoning</span>
            </summary>
            <div class="thought-panel">${thoughtHtml}</div>
        </details>`;
    }

    if (parsed.answer) {
        html += renderMarkdown(parsed.answer);
    } else if ((options.streaming || parsed.thinking) && !parsed.hasThought) {
        html += `<div class="assistant-placeholder">${renderThinkingText('Thinking')}</div>`;
    }

    return html;
}

function syncMessageContentInState(messageId, content) {
    const update = list => {
        const message = list.find(item => item.id === messageId);
        if (message) message.content = content;
    };
    update(messages);
    update(allConversationMessages);
}

function updateRenderedAssistantMessage(messageId, content, options = {}) {
    syncMessageContentInState(messageId, content);
    const body = getMessageBodyElement(messageId);
    if (!body) {
        renderConversation();
        return;
    }

    const keepThoughtOpen = body.querySelector('.thought-toggle')?.open || thoughtOpenState.get(messageId);
    body.innerHTML = renderAssistantContent(content, {
        streaming: Boolean(options.streaming),
        keepThoughtOpen,
    });
    highlightCodeBlocks(body);
    scrollToBottom();
}

async function invalidateConversationSession(convId, options = {}) {
    const conversation = currentConversation?.id === convId
        ? currentConversation
        : await dbGetConversation(convId);
    if (!conversation?.sessionId) return conversation;

    const oldSessionId = conversation.sessionId;
    const updatedConversation = await updateConversationRecord(convId, { sessionId: null });
    if (options.deleteRemote !== false) {
        deleteServerSession(oldSessionId);
    }
    if (currentConversation?.id === convId && updatedConversation) {
        currentConversation = updatedConversation;
    }
    await refreshConversations();
    return updatedConversation;
}

async function ensureConversationSession(reuseExisting) {
    if (!currentConversation) throw new Error('No active conversation');
    if (reuseExisting && currentConversation.sessionId) {
        return currentConversation.sessionId;
    }

    const nextSessionId = genId();
    const updatedConversation = await updateConversationRecord(currentConversation.id, {
        sessionId: nextSessionId,
    });
    currentConversation = updatedConversation;
    await refreshConversations();
    return nextSessionId;
}

async function syncConversationNameFromCurrentPath(convId) {
    const conversation = currentConversation?.id === convId
        ? currentConversation
        : await dbGetConversation(convId);
    if (!conversation || conversation.titleSource === 'manual') return conversation;

    const path = currentConversation?.id === convId && messages.length
        ? messages
        : filterByLeafNodeId(await dbGetConversationMessages(convId), conversation.currNode, false);

    const nextName = deriveTitleFromMessageList(path);
    const updatedConversation = await updateConversationRecord(convId, {
        name: nextName,
        titleSource: 'auto',
    });
    if (currentConversation?.id === convId && updatedConversation) {
        currentConversation = updatedConversation;
    }
    await refreshConversations();
    return updatedConversation;
}

async function loadConversation(convId) {
    if (!convId) {
        currentConversation = null;
        allConversationMessages = [];
        messages = [];
        editorState = null;
        saveUiState({ currentConvId: null });
        renderConversation();
        await refreshConversations();
        return false;
    }

    const conversation = await dbGetConversation(convId);
    if (!conversation) {
        currentConversation = null;
        allConversationMessages = [];
        messages = [];
        editorState = null;
        saveUiState({ currentConvId: null });
        renderConversation();
        await refreshConversations();
        return false;
    }

    currentConversation = conversation;
    allConversationMessages = await dbGetConversationMessages(convId);
    messages = filterByLeafNodeId(allConversationMessages, conversation.currNode, false);
    editorState = null;
    saveUiState({ currentConvId: convId });
    renderConversation();
    await refreshConversations();
    return true;
}

async function ensureActiveConversation() {
    if (currentConversation) return currentConversation;
    const conversation = await createConversation('Untitled', { titleSource: 'auto' });
    currentConversation = conversation;
    allConversationMessages = [];
    messages = [];
    saveUiState({ currentConvId: conversation.id });
    await refreshConversations();
    return conversation;
}

async function renameConversation(convId, newTitle) {
    const trimmed = String(newTitle || '').trim().slice(0, 60);
    if (!trimmed) return;
    const updatedConversation = await updateConversationRecord(convId, {
        name: trimmed,
        titleSource: 'manual',
    });
    if (currentConversation?.id === convId && updatedConversation) {
        currentConversation = updatedConversation;
    }
    await refreshConversations();
}

async function deleteConversation(convId) {
    if (generating) return;
    const conversation = await deleteConversationCascade(convId);
    if (conversation?.sessionId) deleteServerSession(conversation.sessionId);
    if (currentConversation?.id === convId) {
        currentConversation = null;
        allConversationMessages = [];
        messages = [];
        editorState = null;
        saveUiState({ currentConvId: null });
        renderConversation();
    }
    await refreshConversations();
}

async function discardEmptyDraftConversation() {
    if (!currentConversation || currentConversation.currNode) return;
    await deleteConversationCascade(currentConversation.id);
    currentConversation = null;
    allConversationMessages = [];
    messages = [];
    editorState = null;
    saveUiState({ currentConvId: null });
}

async function switchTo(convId) {
    if (generating || convId === getCurrentConvId()) return;
    await discardEmptyDraftConversation();
    await loadConversation(convId);
    inputEl.focus();
}

async function navigateToSibling(leafNodeId) {
    if (generating || !currentConversation) return;
    await invalidateConversationSession(currentConversation.id);
    await updateConversationRecord(currentConversation.id, { currNode: leafNodeId });
    await loadConversation(currentConversation.id);
    await syncConversationNameFromCurrentPath(currentConversation.id);
    await loadConversation(currentConversation.id);
    inputEl.focus();
}

function startEdit(messageId) {
    if (generating) return;
    const message = getMessageById(messageId);
    if (!message) return;
    editorState = {
        messageId,
        content: message.content || '',
        branchAssistant: true,
    };
    renderConversation();
}

function cancelEdit() {
    editorState = null;
    renderConversation();
}

async function saveEdit(messageId) {
    if (!editorState || editorState.messageId !== messageId || !currentConversation) return;
    const message = getMessageById(messageId);
    if (!message) return;

    if (message.role === 'user') {
        const nextContent = editorState.content.trim();
        if (!nextContent) return;

        editorState = null;
        renderConversation();
        setGenerating(true);

        try {
            await invalidateConversationSession(currentConversation.id);
            const newUserMessage = await createMessageBranch({
                convId: currentConversation.id,
                role: 'user',
                type: 'text',
                content: nextContent,
                timestamp: Date.now(),
            }, message.parent);

            await loadConversation(currentConversation.id);
            await syncConversationNameFromCurrentPath(currentConversation.id);
            await loadConversation(currentConversation.id);

            const contextMessages = filterByLeafNodeId(allConversationMessages, newUserMessage.id, false);
            await streamAssistantReply({
                parentId: newUserMessage.id,
                contextMessages,
                reuseSession: false,
            });
        } catch (error) {
            setGenerating(false);
            showError('Failed to edit user message', error);
            await loadConversation(currentConversation.id);
        }
        return;
    }

    if (message.role === 'assistant') {
        const nextContent = editorState.content;
        if (!nextContent.trim()) return;

        const shouldBranch = Boolean(editorState.branchAssistant);
        editorState = null;

        try {
            await invalidateConversationSession(currentConversation.id);
            if (shouldBranch) {
                await createMessageBranch({
                    convId: currentConversation.id,
                    role: 'assistant',
                    type: 'text',
                    content: nextContent,
                    timestamp: Date.now(),
                }, message.parent);
            } else {
                await updateMessageRecord(message.id, {
                    content: nextContent,
                    timestamp: Date.now(),
                });
                const updatedConversation = await updateConversationRecord(currentConversation.id, {
                    currNode: message.id,
                });
                currentConversation = updatedConversation;
            }
            await loadConversation(currentConversation.id);
        } catch (error) {
            showError('Failed to edit assistant message', error);
            await loadConversation(currentConversation.id);
        }
    }
}

async function regenerateAssistant(messageId) {
    if (generating || !currentConversation) return;
    const message = getMessageById(messageId);
    if (!message || message.role !== 'assistant' || !message.parent) return;

    setGenerating(true);
    try {
        const contextMessages = filterByLeafNodeId(allConversationMessages, message.parent, false);
        await invalidateConversationSession(currentConversation.id);
        await streamAssistantReply({
            parentId: message.parent,
            contextMessages,
            reuseSession: false,
        });
    } catch (error) {
        setGenerating(false);
        showError('Failed to regenerate assistant message', error);
        await loadConversation(currentConversation.id);
    }
}

async function streamAssistantReply(options) {
    if (!currentConversation) throw new Error('No active conversation');

    setGenerating(true);
    let assistantMessage = null;
    let streamedContent = '';
    let streamedReasoning = '';
    let streamedAnswer = '';
    const enableThinking = false;

    const composeStreamedContent = (final = false) => {
        if (!streamedReasoning) {
            return streamedAnswer;
        }
        if (!streamedAnswer && final) {
            return streamedReasoning;
        }
        const close = streamedAnswer ? `\n${THINK_CLOSE}\n\n${streamedAnswer}` : '';
        return `${THINK_OPEN}\n${streamedReasoning}${close}`;
    };

    const refreshAssistantMessage = (final = false) => {
        streamedContent = composeStreamedContent(final);
        updateRenderedAssistantMessage(assistantMessage.id, streamedContent, { streaming: !final });
        return streamedContent;
    };

    try {
        assistantMessage = await createMessageBranch({
            convId: currentConversation.id,
            role: 'assistant',
            type: 'text',
            content: '',
            timestamp: Date.now(),
        }, options.parentId);

        await loadConversation(currentConversation.id);
        updateRenderedAssistantMessage(assistantMessage.id, '', { streaming: true });

        const sessionId = await ensureConversationSession(Boolean(options.reuseSession));
        const response = await fetch('/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: buildApiMessages(options.contextMessages),
                stream: true,
                max_tokens: getMaxTokens(),
                session_id: sessionId,
                enable_thinking: enableThinking,
            }),
            signal: (abortCtrl = new AbortController()).signal,
        });

        if (!response.ok) {
            let detail = `HTTP ${response.status}`;
            try {
                const payload = await response.json();
                detail = payload.error?.message || detail;
            } catch {}
            throw new Error(detail);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const payload = line.slice(6).trim();
                if (!payload || payload === '[DONE]') continue;

                try {
                    const data = JSON.parse(payload);
                    if (data.error) {
                        throw new Error(data.error.message || 'Generation error');
                    }
                    const delta = data.choices?.[0]?.delta || {};
                    const contentChunk = delta.content || '';
                    const reasoningChunk = delta.reasoning_content || '';
                    if (!contentChunk && !reasoningChunk) continue;
                    if (enableThinking) {
                        streamedReasoning += reasoningChunk;
                    } else {
                        streamedAnswer += reasoningChunk;
                    }
                    streamedAnswer += contentChunk;
                    refreshAssistantMessage(false);
                } catch (error) {
                    if (error?.message && !error.message.includes('JSON')) {
                        throw error;
                    }
                }
            }
        }

        streamedContent = composeStreamedContent(true);
        if (streamedContent) {
            await updateMessageRecord(assistantMessage.id, {
                content: streamedContent,
                timestamp: Date.now(),
            });
            updateRenderedAssistantMessage(assistantMessage.id, streamedContent, { streaming: false });
        } else {
            await deleteLeafMessage(currentConversation.id, assistantMessage.id);
        }
    } catch (error) {
        if (error?.name === 'AbortError') {
            if (assistantMessage) {
                streamedContent = composeStreamedContent(true);
                if (streamedContent) {
                    await updateMessageRecord(assistantMessage.id, {
                        content: streamedContent,
                        timestamp: Date.now(),
                    });
                    updateRenderedAssistantMessage(assistantMessage.id, streamedContent, { streaming: false });
                } else {
                    await deleteLeafMessage(currentConversation.id, assistantMessage.id);
                }
            }
        } else {
            if (assistantMessage) {
                try {
                    await deleteLeafMessage(currentConversation.id, assistantMessage.id);
                } catch {}
            }
            throw error;
        }
    } finally {
        abortCtrl = null;
        setGenerating(false);
        await loadConversation(currentConversation?.id || null);
        inputEl.focus();
    }
}

function stopGeneration() {
    if (abortCtrl) {
        abortCtrl.abort();
        abortCtrl = null;
    }
}

async function sendMessage() {
    const content = inputEl.value.trim();
    if (!content || generating) return;

    editorState = null;
    setGenerating(true);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    try {
        const conversation = await ensureActiveConversation();
        const rootMessage = await ensureRootMessage(conversation.id);
        const parentId = messages.length ? messages[messages.length - 1].id : rootMessage.id;

        const userMessage = await createMessageBranch({
            convId: conversation.id,
            role: 'user',
            type: 'text',
            content,
            timestamp: Date.now(),
        }, parentId);

        await loadConversation(conversation.id);
        await syncConversationNameFromCurrentPath(conversation.id);
        await loadConversation(conversation.id);

        const contextMessages = filterByLeafNodeId(allConversationMessages, userMessage.id, false);
        await streamAssistantReply({
            parentId: userMessage.id,
            contextMessages,
            reuseSession: true,
        });
    } catch (error) {
        setGenerating(false);
        showError('Failed to send message', error);
        if (currentConversation?.id) {
            await loadConversation(currentConversation.id);
        }
    }
}

async function newChat() {
    if (generating) return;
    await discardEmptyDraftConversation();
    currentConversation = null;
    allConversationMessages = [];
    messages = [];
    editorState = null;
    saveUiState({ currentConvId: null });
    renderConversation();
    await refreshConversations();
    inputEl.focus();
}

async function migrateLegacyStoreIfNeeded() {
    const uiState = loadUiState();
    const existingConversations = await dbGetAllConversations();
    if (uiState.dbVersion === DB_VERSION || existingConversations.length > 0) {
        saveUiState({ dbVersion: DB_VERSION });
        return;
    }

    const legacyStore = loadLegacyStore();
    const entries = [];
    if (Array.isArray(legacyStore.history)) {
        for (const entry of legacyStore.history) {
            entries.push({ ...entry, source: 'history' });
        }
    }
    if (legacyStore.current?.messages?.length) {
        entries.push({ ...legacyStore.current, ts: Date.now(), source: 'current' });
    }

    if (!entries.length) {
        saveUiState({ dbVersion: DB_VERSION });
        return;
    }

    const deduped = new Map();
    for (const entry of entries) {
        const convId = String(entry.convId || genId());
        const rawMessages = Array.isArray(entry.messages)
            ? entry.messages.filter(message => message && typeof message.role === 'string' && typeof message.content === 'string')
            : [];
        if (!rawMessages.length) continue;

        const autoTitle = deriveTitleFromMessageList(rawMessages);
        const savedTitle = String(entry.title || autoTitle || 'Untitled').slice(0, 60);
        const normalized = {
            convId,
            sessionId: entry.sessionId || null,
            title: savedTitle,
            titleSource: savedTitle === autoTitle ? 'auto' : 'manual',
            ts: Number(entry.ts) || Date.now(),
            messages: rawMessages,
            source: entry.source,
        };

        const current = deduped.get(convId);
        if (!current || normalized.source === 'current' || normalized.ts >= current.ts) {
            deduped.set(convId, normalized);
        }
    }

    const orderedEntries = Array.from(deduped.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    for (const entry of orderedEntries) {
        const conversation = await createConversation(entry.title, {
            id: entry.convId,
            titleSource: entry.titleSource,
            sessionId: entry.sessionId,
            lastModified: entry.ts,
        });

        const rootMessage = {
            id: genId(),
            convId: conversation.id,
            type: 'root',
            role: 'system',
            content: '',
            timestamp: entry.ts,
            parent: null,
            children: [],
        };
        await dbPutMessage(rootMessage);

        let parent = rootMessage;
        let currentLeaf = null;
        for (let index = 0; index < entry.messages.length; index++) {
            const legacyMessage = entry.messages[index];
            const nextMessage = {
                id: genId(),
                convId: conversation.id,
                type: 'text',
                role: legacyMessage.role,
                content: legacyMessage.content,
                timestamp: entry.ts + index + 1,
                parent: parent.id,
                children: [],
            };
            parent = {
                ...parent,
                children: [...(parent.children || []), nextMessage.id],
            };
            await dbPutMessage(parent);
            await dbPutMessage(nextMessage);
            parent = nextMessage;
            currentLeaf = nextMessage.id;
        }

        await updateConversationRecord(conversation.id, {
            currNode: currentLeaf,
            sessionId: entry.sessionId,
            name: entry.title,
            titleSource: entry.titleSource,
            lastModified: entry.ts,
        });
    }

    const currentConvId = legacyStore.current?.messages?.length
        ? String(legacyStore.current.convId || '')
        : null;
    saveUiState({
        dbVersion: DB_VERSION,
        currentConvId: currentConvId || null,
    });
}

inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

inputEl.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (!generating) sendMessage();
    }
});

maxTokensEl.addEventListener('change', () => {
    const value = getMaxTokens();
    maxTokensEl.value = String(value);
    saveUiState({ maxTokens: value });
});

confirmModalCancelEl.addEventListener('click', () => {
    closeConfirmModal(false);
});

confirmModalConfirmEl.addEventListener('click', () => {
    closeConfirmModal(true);
});

confirmModalBackdropEl.addEventListener('click', () => {
    closeConfirmModal(false);
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && confirmModalState) {
        event.preventDefault();
        closeConfirmModal(false);
    }
});

fetch('/v1/models')
    .then(response => response.json())
    .then(data => {
        if (data.data?.[0]) {
            modelNameEl.textContent = data.data[0].id;
        }
    })
    .catch(() => {
        modelNameEl.textContent = 'unknown';
    });

async function init() {
    const uiState = loadUiState();
    if (uiState.maxTokens) {
        maxTokensEl.value = String(uiState.maxTokens);
    }

    try {
        await openDatabase();
        await migrateLegacyStoreIfNeeded();
        await refreshConversations();

        const currentConvId = loadUiState().currentConvId;
        if (currentConvId) {
            const loaded = await loadConversation(currentConvId);
            if (!loaded) {
                renderConversation();
            }
        } else {
            renderConversation();
        }
    } catch (error) {
        console.error('Failed to initialize chat storage', error);
        chatEl.innerHTML = `<p class="error-text">Failed to initialize local chat storage.</p>`;
    }
}

init();
</script>
