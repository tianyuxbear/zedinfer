<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<title>ZedInfer</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #ffffff;
    --bg-secondary: #f7f7f8;
    --bg-hover: #ececf1;
    --text: #343541;
    --text-secondary: #6e6e80;
    --text-light: #8e8ea0;
    --border: #e5e5e5;
    --accent: #10a37f;
    --accent-hover: #0d8a6c;
    --user-bg: #f7f7f8;
    --assistant-bg: #ffffff;
    --code-bg: #f6f8fa;
    --code-border: #e1e4e8;
    --input-bg: #ffffff;
    --input-border: #d9d9e3;
    --input-focus: #10a37f;
    --shadow: 0 0 10px rgba(0,0,0,0.05);
    --sidebar-width: 260px;
    --max-content: 768px;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}

body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    height: 100vh;
    display: flex;
}

/* ===== Sidebar ===== */
.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
}
.sidebar-header button {
    width: 100%;
    padding: 10px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
}
.sidebar-header button:hover { background: var(--bg-hover); }
.sidebar-header button::before { content: '+'; font-size: 18px; font-weight: 300; }
.sidebar-info {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
}
.sidebar-info .info-item {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
    line-height: 1.5;
}
.sidebar-info .info-label {
    font-weight: 600;
    color: var(--text-secondary);
}
.sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-light);
    text-align: center;
}

/* ===== Main ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* ===== Chat Messages ===== */
.chat-scroll {
    flex: 1;
    overflow-y: auto;
}
.chat-messages {
    max-width: var(--max-content);
    margin: 0 auto;
    padding: 24px 24px 100px;
}

/* Welcome */
.welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 24px;
    text-align: center;
}
.welcome-logo {
    margin-bottom: 16px;
}
.welcome-logo img {
    width: 60%;
    height: auto;
}
.welcome h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
}
.welcome p {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 400px;
    line-height: 1.6;
}

/* Message row */
.msg-row {
    padding: 24px 0;
}
.msg-row + .msg-row { border-top: 1px solid var(--border); }
.msg-inner {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}
.msg-avatar {
    width: 32px; height: 32px;
    border-radius: 4px;
    flex-shrink: 0;
    overflow: hidden;
}
.msg-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.msg-content {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    line-height: 1.7;
}
.msg-content p { margin: 0 0 12px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content strong { font-weight: 600; }
.msg-content pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 6px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0;
    font-size: 13px;
    line-height: 1.6;
}
.msg-content code {
    font-family: var(--font-mono);
    font-size: 13px;
}
.msg-content :not(pre) > code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
}
.msg-content ul, .msg-content ol {
    margin: 8px 0 8px 20px;
}
.msg-content li { margin-bottom: 4px; }
.thinking-text {
    color: var(--text-light);
    font-style: italic;
}
.thinking-text::after {
    content: '';
    animation: dots 1.4s steps(4) infinite;
}
@keyframes dots {
    0%  { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
}

/* ===== Input Area ===== */
.input-wrapper {
    padding: 0 24px 24px;
    background: linear-gradient(transparent 0%, var(--bg) 30%);
    position: sticky;
    bottom: 0;
}
.input-box {
    max-width: var(--max-content);
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-end;
    padding: 8px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.input-box:focus-within {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 2px rgba(16,163,127,0.15);
}
.input-box textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: transparent;
    padding: 6px 4px;
    min-height: 24px;
    max-height: 200px;
}
.input-box textarea::placeholder { color: var(--text-light); }
.input-box .send-btn {
    width: 36px; height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
    margin-left: 8px;
}
.input-box .send-btn:hover { background: var(--accent-hover); }
.input-box .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
.input-box .stop-btn {
    width: 36px; height: 36px;
    background: #ef4444;
    border: none; border-radius: 8px;
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 8px;
    font-size: 16px;
}
.input-box .stop-btn:hover { background: #dc2626; }
.input-box .send-btn svg { width: 18px; height: 18px; }
.input-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
    max-width: var(--max-content);
    margin-left: auto;
    margin-right: auto;
}

/* ===== Sidebar Sections ===== */
.sidebar-section { padding: 0 12px; }
.sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-light);
    margin: 14px 4px 8px;
}
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
}
.setting-row label { font-size: 13px; color: var(--text-secondary); }
.setting-row input[type="number"] {
    width: 80px; padding: 4px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; color: var(--text); text-align: right;
    outline: none; font-family: var(--font-mono);
}
.setting-row input[type="number"]:focus { border-color: var(--input-focus); }

/* History list */
.history-list { list-style: none; }
.history-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.history-item:hover { background: var(--bg-hover); }
.history-item.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }
.history-item .delete-btn {
    margin-left: auto;
    opacity: 0;
    color: var(--text-light);
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    flex-shrink: 0;
}
.history-item:hover .delete-btn { opacity: 0.6; }
.history-item .delete-btn:hover { opacity: 1; color: var(--accent); }
.history-item .rename-input {
    flex: 1; min-width: 0;
    border: 1px solid var(--input-focus); border-radius: 4px;
    padding: 2px 6px; font-size: 13px; color: var(--text);
    outline: none; background: var(--bg);
}
.msg-content h1, .msg-content h2, .msg-content h3 { margin: 12px 0 6px; font-weight: 600; }
.msg-content h1 { font-size: 1.4em; }
.msg-content h2 { font-size: 1.2em; }
.msg-content h3 { font-size: 1.1em; }
.msg-content a { color: var(--accent); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.msg-content th, .msg-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 14px; }
.msg-content th { background: var(--bg-secondary); font-weight: 600; }
.msg-content pre { position: relative; }
.msg-content .copy-btn {
    position: absolute; top: 6px; right: 6px;
    background: var(--border); border: none; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--text-secondary);
    opacity: 0; transition: opacity 0.15s;
}
.msg-content pre:hover .copy-btn { opacity: 1; }
.msg-content .copy-btn:hover { background: var(--text-light); color: white; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-messages { padding: 16px 16px 100px; }
    .input-wrapper { padding: 0 12px 16px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <button onclick="newChat()">New Chat</button>
    </div>
    <div class="sidebar-info">
        <div class="sidebar-section">
            <h3>History</h3>
            <ul class="history-list" id="history-list"></ul>
        </div>
        <div class="sidebar-section">
            <h3>Settings</h3>
            <div class="setting-row">
                <label>Max tokens</label>
                <input type="number" id="max-tokens" value="1024" min="64" max="8192" step="64">
            </div>
        </div>
        <div class="sidebar-section">
            <div class="info-item" style="margin-top:8px">
                <span class="info-label">Model</span><br>
                <span id="model-name">loading...</span>
            </div>
        </div>
    </div>
    <div class="sidebar-footer">
        Powered by ZedInfer
    </div>
</div>

<!-- Main Area -->
<div class="main">
    <div class="chat-scroll" id="chat-scroll">
        <div class="chat-messages" id="chat">
            <div class="welcome" id="welcome">
                <div class="welcome-logo"><img src="/images/zedinfer.svg" alt="ZedInfer"></div>
                <p>A lightweight C++ inference engine. Type a message below to start chatting.</p>
            </div>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <textarea id="input" placeholder="Message ZedInfer..." rows="1" autofocus></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
            <button class="stop-btn" id="stop-btn" onclick="stopGeneration()" style="display:none">&#9632;</button>
        </div>
        <div class="input-hint">Enter to send, Shift+Enter for new line</div>
    </div>
</div>

<script>
// ===== State =====
let messages = [];
let generating = false;
let sessionId = '';
let currentConvId = '';
let abortCtrl = null; // AbortController for stopping generation
const STORAGE = 'zedinfer_state';
const WELCOME_HTML = `<div class="welcome" id="welcome">
    <div class="welcome-logo"><img src="/images/zedinfer.svg" alt="ZedInfer"></div>
    <p>A lightweight C++ inference engine. Type a message below to start chatting.</p>
</div>`;

const chatEl = document.getElementById('chat');
const chatScroll = document.getElementById('chat-scroll');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const modelNameEl = document.getElementById('model-name');
const maxTokensEl = document.getElementById('max-tokens');
const historyListEl = document.getElementById('history-list');

// ===== Persistence =====
function genId() { return Math.random().toString(36).substr(2,9) + Date.now().toString(36); }
function loadStore() { try { return JSON.parse(localStorage.getItem(STORAGE)) || {}; } catch { return {}; } }
function saveStore(s) { localStorage.setItem(STORAGE, JSON.stringify(s)); }

function saveCurrent() {
    const s = loadStore();
    s.current = messages.length > 0 ? { convId: currentConvId, sessionId, messages } : null;
    saveStore(s);
}

function saveToHistory() {
    if (messages.length === 0) return;
    const s = loadStore();
    if (!s.history) s.history = [];
    const title = (messages.find(m => m.role === 'user')?.content || 'Untitled').substring(0, 60);
    s.history = s.history.filter(h => h.convId !== currentConvId);
    s.history.unshift({ convId: currentConvId, sessionId, title, messages, ts: Date.now() });
    s.history = s.history.slice(0, 50);
    saveStore(s);
}

function renameHistory(convId, newTitle) {
    const s = loadStore();
    const entry = (s.history || []).find(h => h.convId === convId);
    if (entry) { entry.title = newTitle.substring(0, 60); saveStore(s); }
    renderHistory();
}

function deleteHistory(convId) {
    const s = loadStore();
    if (!s.history) return;
    const entry = s.history.find(h => h.convId === convId);
    s.history = s.history.filter(h => h.convId !== convId);
    saveStore(s);
    if (entry?.sessionId) fetch('/v1/sessions/' + entry.sessionId, { method: 'DELETE' }).catch(() => {});
    renderHistory();
}

// ===== History Sidebar =====
function renderHistory() {
    const s = loadStore();
    historyListEl.innerHTML = '';
    for (const h of (s.history || [])) {
        const li = document.createElement('li');
        li.className = 'history-item' + (h.convId === currentConvId ? ' active' : '');
        li.title = h.title;

        const span = document.createElement('span');
        span.textContent = h.title;
        span.style.cssText = 'overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0';

        // Double-click to rename
        span.ondblclick = (e) => {
            e.stopPropagation();
            const input = document.createElement('input');
            input.className = 'rename-input';
            input.value = h.title;
            input.onclick = e => e.stopPropagation();
            input.onkeydown = e => {
                if (e.key === 'Enter') { renameHistory(h.convId, input.value.trim() || h.title); }
                if (e.key === 'Escape') { renderHistory(); }
            };
            input.onblur = () => renameHistory(h.convId, input.value.trim() || h.title);
            span.replaceWith(input);
            input.focus();
            input.select();
        };

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '\u00d7';
        del.onclick = e => { e.stopPropagation(); deleteHistory(h.convId); };

        li.appendChild(span);
        li.appendChild(del);
        li.onclick = () => switchTo(h.convId);
        historyListEl.appendChild(li);
    }
}

function switchTo(convId) {
    if (generating || convId === currentConvId) return;
    saveToHistory();
    const s = loadStore();
    const entry = (s.history || []).find(h => h.convId === convId);
    if (!entry) return;
    currentConvId = entry.convId;
    sessionId = entry.sessionId;
    messages = [...entry.messages];
    chatEl.innerHTML = '';
    for (const m of messages) addMessage(m.role, m.content);
    saveCurrent();
    renderHistory();
    inputEl.focus();
}

// ===== Init =====
fetch('/v1/models')
    .then(r => r.json())
    .then(d => { if (d.data?.[0]) modelNameEl.textContent = d.data[0].id; })
    .catch(() => { modelNameEl.textContent = 'unknown'; });

(function init() {
    const s = loadStore();
    if (s.current?.messages?.length > 0) {
        currentConvId = s.current.convId;
        sessionId = s.current.sessionId;
        messages = s.current.messages;
        chatEl.innerHTML = '';
        for (const m of messages) addMessage(m.role, m.content);
    } else {
        currentConvId = genId();
        sessionId = genId();
    }
    renderHistory();
})();

// ===== UI Helpers =====
inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});
inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!generating) sendMessage(); }
});

function scrollToBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

function setGenerating(v) {
    generating = v;
    sendBtn.style.display = v ? 'none' : 'flex';
    stopBtn.style.display = v ? 'flex' : 'none';
    sendBtn.disabled = v;
}

// ===== Markdown Renderer =====
function renderMarkdown(text) {
    let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Code blocks with copy button
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const escaped = code.trimEnd();
        const id = 'cb' + Math.random().toString(36).substr(2,6);
        return `<pre><button class="copy-btn" onclick="copyCode('${id}')">Copy</button><code id="${id}">${escaped}</code></pre>`;
    });

    // Inline code
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // Tables: | h1 | h2 |\n|---|---|\n| c1 | c2 |
    h = h.replace(/((?:^|\n)\|.+\|(?:\n\|[-: |]+\|)(?:\n\|.+\|)+)/g, (_, table) => {
        const rows = table.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return table;
        const hdr = rows[0].split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
        let body = '';
        for (let i = 2; i < rows.length; i++) {
            const cells = rows[i].split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
            body += `<tr>${cells}</tr>`;
        }
        return `<table><thead><tr>${hdr}</tr></thead><tbody>${body}</tbody></table>`;
    });

    // Headers
    h = h.replace(/(^|\n)### (.+)/g, '$1<h3>$2</h3>');
    h = h.replace(/(^|\n)## (.+)/g, '$1<h2>$2</h2>');
    h = h.replace(/(^|\n)# (.+)/g, '$1<h1>$2</h1>');

    // Bold + Italic
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

    // Links: [text](url)
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // Unordered lists
    h = h.replace(/(^|\n)([-*] .+(\n[-*] .+)*)/g, (_,p,list) => {
        return p+'<ul>'+list.split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>';
    });
    // Ordered lists
    h = h.replace(/(^|\n)(\d+\. .+(\n\d+\. .+)*)/g, (_,p,list) => {
        return p+'<ol>'+list.split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>';
    });

    // Paragraphs
    h = h.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
    return '<p>' + h + '</p>';
}

function copyCode(id) {
    const el = document.getElementById(id);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(() => {
        const btn = el.parentElement.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
    });
}

function addMessage(role, content) {
    const w = document.getElementById('welcome'); if (w) w.remove();
    const row = document.createElement('div'); row.className = 'msg-row';
    const inner = document.createElement('div'); inner.className = 'msg-inner';
    const av = document.createElement('div'); av.className = 'msg-avatar '+role;
    const img = document.createElement('img');
    img.src = role==='user' ? '/images/user.svg' : '/images/bot.svg'; img.alt = role;
    av.appendChild(img);
    const body = document.createElement('div'); body.className = 'msg-content';
    if (content) body.innerHTML = renderMarkdown(content);
    inner.appendChild(av); inner.appendChild(body);
    row.appendChild(inner); chatEl.appendChild(row);
    scrollToBottom();
    return body;
}

// ===== Stop Generation =====
function stopGeneration() {
    if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
}

// ===== Send Message =====
async function sendMessage() {
    const content = inputEl.value.trim();
    if (!content || generating) return;
    setGenerating(true);
    inputEl.value = ''; inputEl.style.height = 'auto';

    messages.push({ role: 'user', content });
    addMessage('user', content);
    saveCurrent();

    const bodyEl = addMessage('assistant', '');
    bodyEl.innerHTML = '<span class="thinking-text">Thinking</span>';
    let out = '';
    const maxTokens = parseInt(maxTokensEl.value) || 1024;

    abortCtrl = new AbortController();

    try {
        const resp = await fetch('/v1/chat/completions', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ messages, stream:true, max_tokens:maxTokens, session_id:sessionId }),
            signal: abortCtrl.signal
        });
        if (!resp.ok) { const e = await resp.json(); throw new Error(e.error?.message || `HTTP ${resp.status}`); }

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n'); buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const d = line.slice(6).trim();
                if (d === '[DONE]' || !d) continue;
                try {
                    const c = JSON.parse(d);
                    if (c.error) throw new Error(c.error.message || 'Generation error');
                    const t = c.choices?.[0]?.delta?.content;
                    if (t) { out += t; bodyEl.innerHTML = renderMarkdown(out); scrollToBottom(); }
                } catch (e) { if (e.message && !e.message.includes('JSON')) throw e; }
            }
        }
        messages.push({ role: 'assistant', content: out });
    } catch (err) {
        if (err.name === 'AbortError') {
            // User clicked stop — keep partial output
            if (out) messages.push({ role: 'assistant', content: out });
        } else {
            bodyEl.innerHTML = '<p style="color:#ef4444;">Error: '+err.message.replace(/</g,'&lt;')+'</p>';
        }
    }

    abortCtrl = null;
    saveCurrent(); saveToHistory(); renderHistory();
    setGenerating(false);
    inputEl.focus();
}

// ===== New Chat =====
function newChat() {
    if (generating) return;
    saveToHistory();
    if (sessionId) fetch('/v1/sessions/'+sessionId, { method:'DELETE' }).catch(()=>{});
    messages = []; currentConvId = genId(); sessionId = genId();
    saveCurrent(); renderHistory();
    chatEl.innerHTML = WELCOME_HTML;
    inputEl.focus();
}
</script>
