<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/highlight.js/styles/github.min.css">
<title>ZedInfer</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #ffffff;
    --bg-secondary: #f7f7f8;
    --bg-hover: #ececf1;
    --bg-soft: #fbfbfc;
    --text: #343541;
    --text-secondary: #6e6e80;
    --text-light: #8e8ea0;
    --border: #e5e5e5;
    --accent: #10a37f;
    --accent-hover: #0d8a6c;
    --accent-soft: rgba(16, 163, 127, 0.08);
    --user-bg: #f7f7f8;
    --assistant-bg: #ffffff;
    --code-bg: #f6f8fa;
    --code-border: #e1e4e8;
    --input-bg: #ffffff;
    --input-border: #d9d9e3;
    --input-focus: #10a37f;
    --shadow: 0 0 10px rgba(0,0,0,0.05);
    --sidebar-width: 260px;
    --max-content: 768px;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}

body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg-secondary);
    height: 100vh;
    display: flex;
}

/* ===== Sidebar ===== */
.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
}
.sidebar-header button {
    width: 100%;
    padding: 10px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
}
.sidebar-header button:hover { background: var(--bg-hover); }
.sidebar-header button::before { content: '+'; font-size: 18px; font-weight: 300; }
.sidebar-info {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
}
.sidebar-info .info-item {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
    line-height: 1.5;
}
.sidebar-info .info-label {
    font-weight: 600;
    color: var(--text-secondary);
}
.sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-light);
    text-align: center;
}

/* ===== Main ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
}

/* ===== Chat Messages ===== */
.chat-scroll {
    flex: 1;
    overflow-y: auto;
}
.chat-messages {
    max-width: var(--max-content);
    margin: 0 auto;
    padding: 24px 24px 100px;
}

/* Welcome */
.welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 104px 24px 24px;
    text-align: center;
}
.welcome-logo {
    margin-bottom: 16px;
}
.welcome-logo img {
    width: 60%;
    height: auto;
}
.welcome h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
}
.welcome p {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 460px;
    line-height: 1.6;
}

/* Message row */
.msg-row {
    padding: 24px 0;
}
.msg-row + .msg-row { border-top: 1px solid var(--border); }
.msg-inner {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}
.msg-avatar {
    width: 32px; height: 32px;
    border-radius: 4px;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-soft);
}
.msg-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.msg-content {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    line-height: 1.7;
}
.msg-head {
    margin-bottom: 10px;
}
.msg-role {
    font-size: 11px;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    line-height: 1.4;
}
.tool-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.tool-btn:hover {
    background: var(--bg-hover);
    border-color: var(--input-border);
}
.tool-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.msg-footer {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
.msg-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
}
.action-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.action-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.action-btn:hover {
    background: var(--bg-hover);
    border-color: var(--input-border);
}
.action-btn.is-active {
    color: var(--accent);
    border-color: rgba(16, 163, 127, 0.45);
    background: var(--accent-soft);
}
.action-btn.danger:hover {
    color: #dc2626;
    border-color: rgba(220, 38, 38, 0.22);
    background: rgba(220, 38, 38, 0.06);
}
.action-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}
.branch-nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-left: 2px;
}
.branch-status {
    min-width: 34px;
    text-align: center;
    color: var(--text-light);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}
.msg-body {
    min-width: 0;
}
.msg-content p { margin: 0 0 12px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content strong { font-weight: 600; }
.msg-content pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 6px;
    overflow: hidden;
    margin: 12px 0;
    font-size: 13px;
    line-height: 1.6;
    position: relative;
}
.code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 10px 8px 12px;
    border-bottom: 1px solid var(--code-border);
    background: rgba(255, 255, 255, 0.55);
}
.code-lang {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-light);
    white-space: nowrap;
}
.msg-content code {
    font-family: var(--font-mono);
    font-size: 13px;
}
.msg-content pre code.hljs {
    display: block;
    padding: 14px 16px;
    background: transparent;
    color: inherit;
    overflow-x: auto;
}
.msg-content pre code:not(.hljs) {
    display: block;
    padding: 14px 16px;
    overflow-x: auto;
}
.msg-content :not(pre) > code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
}
.msg-content ul, .msg-content ol {
    margin: 8px 0 8px 20px;
}
.msg-content li { margin-bottom: 4px; }
.thought-toggle {
    margin-bottom: 10px;
}
.thought-toggle summary {
    list-style: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-light);
    font-size: 12px;
}
.thought-toggle summary::-webkit-details-marker {
    display: none;
}
.thought-label-expanded {
    display: none;
}
.thought-toggle.thinking .thought-label-expanded {
    display: none;
}
.thought-toggle[open] .thought-label-collapsed {
    display: none;
}
.thought-toggle[open]:not(.thinking) .thought-label-expanded {
    display: inline;
}
.thought-toggle[open].thinking .thought-label-collapsed {
    display: inline;
}
.thought-chevron {
    width: 9px;
    height: 9px;
    border-right: 1.5px solid var(--text-light);
    border-bottom: 1.5px solid var(--text-light);
    transform: rotate(45deg);
    transition: transform 0.15s ease;
}
.thought-toggle[open] .thought-chevron {
    transform: rotate(225deg);
}
.thought-toggle .thinking-text {
    font-size: 12px;
}
.thought-panel {
    margin: 8px 0 0 18px;
    padding-left: 12px;
    border-left: 1px solid var(--border);
    color: var(--text-light);
    font-size: 14px;
    line-height: 1.65;
}
.thought-panel > *:first-child {
    margin-top: 0;
}
.thought-panel strong,
.thought-panel h1,
.thought-panel h2,
.thought-panel h3,
.thought-panel th,
.thought-panel td,
.thought-panel code,
.thought-panel a {
    color: var(--text-secondary);
}
.thought-panel a:hover {
    color: var(--text-secondary);
}
.thought-panel blockquote {
    color: var(--text-light);
}
.thought-empty {
    color: var(--text-light);
    font-style: italic;
}
.assistant-placeholder {
    margin-bottom: 10px;
}
.editor-shell {
    border: 1px solid var(--input-border);
    border-radius: 12px;
    background: var(--bg-soft);
    padding: 12px;
}
.editor-shell textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    padding: 10px 12px;
    outline: none;
}
.editor-shell textarea:focus {
    border-color: var(--input-focus);
}
.editor-foot {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}
.editor-note {
    color: var(--text-light);
    font-size: 12px;
}
.editor-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 12px;
}
.editor-toggle input {
    accent-color: var(--accent);
}
.editor-actions {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.toast-stack {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1200;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}
.toast {
    min-width: 240px;
    max-width: min(420px, calc(100vw - 32px));
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    color: var(--text);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    pointer-events: auto;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.16s ease, transform 0.16s ease;
}
.toast.is-visible {
    opacity: 1;
    transform: translateY(0);
}
.toast.success {
    border-color: rgba(16, 163, 127, 0.22);
    background: rgba(248, 255, 252, 0.97);
}
.toast.error {
    border-color: rgba(220, 38, 38, 0.18);
    background: rgba(255, 250, 250, 0.98);
}
.toast-title {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
}
.toast.success .toast-title {
    color: #0f8a6b;
}
.toast.error .toast-title {
    color: #dc2626;
}
.toast-message {
    color: var(--text-secondary);
    word-break: break-word;
}
.modal-layer[hidden] {
    display: none;
}
.modal-layer {
    position: fixed;
    inset: 0;
    z-index: 1300;
}
.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(17, 24, 39, 0.32);
}
.modal-card {
    position: relative;
    z-index: 1;
    width: min(420px, calc(100vw - 32px));
    margin: 12vh auto 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 20px 48px rgba(15, 23, 42, 0.18);
    padding: 20px;
}
.modal-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
}
.modal-message {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-secondary);
}
.modal-actions {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
}
.modal-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.modal-btn:hover {
    background: var(--bg-hover);
    border-color: var(--input-border);
}
.modal-btn.confirm {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.modal-btn.confirm:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
}
.modal-btn.confirm.danger {
    background: #dc2626;
    border-color: #dc2626;
}
.modal-btn.confirm.danger:hover {
    background: #b91c1c;
    border-color: #b91c1c;
}
.error-text {
    color: #ef4444;
}
.thinking-text {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-light);
    font-style: normal;
}
.thinking-spinner {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid rgba(142, 142, 160, 0.3);
    border-top-color: var(--text-light);
    animation: spin 0.9s linear infinite;
    flex-shrink: 0;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== Input Area ===== */
.input-wrapper {
    padding: 0 24px 24px;
    background: linear-gradient(transparent 0%, var(--bg) 30%);
    position: sticky;
    bottom: 0;
}
.input-box {
    max-width: var(--max-content);
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), var(--shadow);
    display: flex;
    align-items: flex-end;
    padding: 8px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.input-box:focus-within {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 2px rgba(16,163,127,0.15);
}
.input-box textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: transparent;
    padding: 6px 4px;
    min-height: 24px;
    max-height: 200px;
}
.input-box textarea::placeholder { color: var(--text-light); }
.input-box .send-btn {
    width: 36px; height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
    margin-left: 8px;
}
.input-box .send-btn:hover { background: var(--accent-hover); }
.input-box .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
.input-box .stop-btn {
    width: 36px; height: 36px;
    background: #ef4444;
    border: none; border-radius: 8px;
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 8px;
    font-size: 16px;
}
.input-box .stop-btn:hover { background: #dc2626; }
.input-box .send-btn svg { width: 18px; height: 18px; }
.input-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
    max-width: var(--max-content);
    margin-left: auto;
    margin-right: auto;
}

/* ===== Sidebar Sections ===== */
.sidebar-section { padding: 0 12px; }
.sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-light);
    margin: 14px 4px 8px;
}
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
}
.setting-row label { font-size: 13px; color: var(--text-secondary); }
.setting-row input[type="number"] {
    width: 80px; padding: 4px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; color: var(--text); text-align: right;
    outline: none; font-family: var(--font-mono);
}
.setting-row input[type="number"]:focus { border-color: var(--input-focus); }

/* History list */
.history-list { list-style: none; }
.history-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.history-item:hover { background: var(--bg-hover); }
.history-item.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }
.history-item .delete-btn {
    margin-left: auto;
    opacity: 0;
    color: var(--text-light);
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    flex-shrink: 0;
}
.history-item:hover .delete-btn { opacity: 0.6; }
.history-item .delete-btn:hover { opacity: 1; color: var(--accent); }
.history-item .rename-input {
    flex: 1; min-width: 0;
    border: 1px solid var(--input-focus); border-radius: 4px;
    padding: 2px 6px; font-size: 13px; color: var(--text);
    outline: none; background: var(--bg);
}
.history-empty {
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-light);
    background: var(--bg);
    border: 1px dashed var(--border);
}
.msg-content h1, .msg-content h2, .msg-content h3 { margin: 12px 0 6px; font-weight: 600; }
.msg-content h1 { font-size: 1.4em; }
.msg-content h2 { font-size: 1.2em; }
.msg-content h3 { font-size: 1.1em; }
.msg-content a { color: var(--accent); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.msg-content th, .msg-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 14px; }
.msg-content th { background: var(--bg-secondary); font-weight: 600; }
.msg-content .copy-btn {
    position: static;
    background: var(--border); border: none; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--text-secondary);
    flex-shrink: 0;
}
.msg-content .copy-btn:hover { background: var(--text-light); color: white; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-messages { padding: 16px 16px 100px; }
    .input-wrapper { padding: 0 12px 16px; }
    .toast-stack {
        top: 12px;
        left: 12px;
        right: 12px;
    }
    .toast {
        min-width: 0;
        max-width: none;
    }
    .modal-card {
        width: calc(100vw - 24px);
        margin-top: 10vh;
    }
    .msg-footer {
        align-items: flex-start;
    }
    .msg-actions {
        justify-content: flex-start;
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <button onclick="newChat()">New Chat</button>
    </div>
    <div class="sidebar-info">
        <div class="sidebar-section">
            <h3>History</h3>
            <ul class="history-list" id="history-list"></ul>
        </div>
        <div class="sidebar-section">
            <h3>Settings</h3>
            <div class="setting-row">
                <label>Max tokens</label>
                <input type="number" id="max-tokens" value="1024" min="64" max="8192" step="64">
            </div>
        </div>
        <div class="sidebar-section">
            <div class="info-item" style="margin-top:8px">
                <span class="info-label">Model</span><br>
                <span id="model-name">loading...</span>
            </div>
        </div>
    </div>
    <div class="sidebar-footer">
        Powered by ZedInfer
    </div>
</div>

<!-- Main Area -->
<div class="main">
