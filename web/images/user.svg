<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <radialGradient id="userGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84FAB0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8FD3F4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .user-float { animation: floatUser 4s ease-in-out infinite; }
    .user-wink { animation: winkUser 5s infinite; transform-origin: 38px 54px; }
    @keyframes floatUser { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-4px); } 
    }
    @keyframes winkUser { 
      0%, 85%, 100% { transform: scaleY(1); } 
      90%, 95% { transform: scaleY(0.1); } 
    }
  </style>

  <circle cx="50" cy="50" r="50" fill="url(#userGlow)" />

  <g class="user-float">
    <path d="M 25 95 C 25 70, 75 70, 75 95" fill="#FF9A9E" stroke="#FF758C" stroke-width="2"/>
    <path d="M 35 95 C 35 85, 65 85, 65 95" fill="#FF758C" />
    
    <rect x="28" y="32" width="44" height="44" rx="22" fill="#FFE0C8" />
    
    <path d="M 26 48 C 26 15, 74 15, 74 48 C 65 30, 35 30, 26 48 Z" fill="#4A3F35" />
    
    <path d="M 22 52 C 22 20, 78 20, 78 52" fill="none" stroke="#FF6B6B" stroke-width="4.5" stroke-linecap="round" />
    <rect x="18" y="42" width="8" height="22" rx="4" fill="#4ECDC4" />
    <rect x="74" y="42" width="8" height="22" rx="4" fill="#4ECDC4" />
    <rect x="20" y="46" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.6" />
    <rect x="76" y="46" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.6" />
    
    <circle cx="36" cy="62" r="4" fill="#FF8A8A" opacity="0.6" />
    <circle cx="64" cy="62" r="4" fill="#FF8A8A" opacity="0.6" />
    
    <g class="user-wink">
      <circle cx="38" cy="54" r="3.5" fill="#355C7D" />
    </g>
    <circle cx="62" cy="54" r="3.5" fill="#355C7D" />
    
    <path d="M 46 64 Q 50 70 54 64" fill="none" stroke="#355C7D" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
